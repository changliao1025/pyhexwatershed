[bumpversion]
current_version = 0.2.30
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:pyhexwatershed/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs,build,dist,.git,__pycache__
max-line-length = 150
extend-ignore = E203, E501, F401, F841, E402, F541, E741, F811, F403, E265, E712, F405, W503, E722
per-file-ignores =
    examples/*: E402, F811, F401
    tests/*: F401, F811
